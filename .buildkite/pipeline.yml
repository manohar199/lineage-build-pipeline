steps:
  - label: "🔄 Sync LineageOS 24.0 Source Tree"
    key: "sync"
    commands:
      - "echo 'Setting Git environment rules for large repositories...'"
      - "git config --global user.name 'Local Buildkite Agent'"
      - "git config --global user.email 'agent@localpc.internal'"
      
      # Boost Git network transfer thresholds and buffer size to handle heavy zip packs
      - "git config --global http.postBuffer 1048576000"
      - "git config --global https.postBuffer 1048576000"
      
      - "echo 'Creating AOSP source directory workspace...'"
      - "mkdir -p /root/rom_workspace && cd /root/rom_workspace"
      
      - "echo 'Initializing LineageOS 24.0 Shallow Manifest...'"
      # Crucial: --depth=1 speeds up download times by skipping deep Git history log streams
      - "echo 'y' | repo init -u https://github.com/LineageOS/android.git -b lineage-24.0 --depth=1 --git-lfs"
      
      - "echo 'Syncing remote trees with optimized thread jobs...'"
      # Swapped out $(nproc) for an explicit, safer network job pool (-j4 or -j8) to avoid IP connection timeouts
      - "repo sync -c -j4 --fail-fast --force-sync --no-clone-bundle --no-tags"
    agents:
      queue: "custom-rom"

  - label: "📂 Execute Remote Gist & Setup Build Environment"
    key: "device_prep"
    depends_on: "sync"
    commands:
      - "cd /root/rom_workspace"
      - "echo 'Downloading and running your custom build preparation script from Gist...'"
      - "curl -LSs https://gist.githubusercontent.com/manohar199/f85699164d889c7aa4855f57af466e66/raw/0762cfa290da7e27951c3c9064c49337edbee437/build.sh | bash"
    agents:
      queue: "custom-rom"

  - label: "🛠️ Compile LineageOS 24 Custom ROM"
    key: "compile"
    depends_on: "device_prep"
    commands:
      - "cd /root/rom_workspace"
      - "echo 'Enabling Compiler Cache (ccache) for local hardware acceleration...'"
      - "export USE_CCACHE=1"
      - "export CCACHE_DIR='/root/.ccache'"
      - "ccache -M 50G"
      - "echo 'Sourcing environment configuration helpers...'"
      - "source build/envsetup.sh"
      - "echo 'Lunching device configuration target...'"
      - "lunch lineage_spring-cp2a-user"
      - "echo 'Starting ROM Compilation...'"
      # Keeps full CPU compilation core utilization intact for the actual build phase
      - "mka bacon -j$(nproc --all)"
    agents:
      queue: "custom-rom"
